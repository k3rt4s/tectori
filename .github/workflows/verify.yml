# Runs this site's own checks on a clean machine for every push and pull request.
#
# The checks have always existed; what this adds is somewhere they run that is
# not the author's laptop. The line-ending defect fixed on 2026-09-12 is the
# case in point: it was invisible on a Windows working copy and obvious on the
# first Linux checkout, and every check passed while it was present.
#
# The deploy job at the bottom is what GitHub Pages now publishes, and it runs
# only after the checks pass. Until 2026-09-12 Pages published main and docs/
# on its own, so this workflow reported on a tree visitors were already being
# served: a red run meant the site was already broken.

name: Verify the site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, and never cancel one in flight. A cancelled deploy
# leaves whichever tree was mid-upload, and the site is the artifact.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # These majors are the ones running on Node 24. The previous pair,
      # checkout@v4 and setup-python@v5, still work and annotate every run
      # with a Node 20 deprecation notice.
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      # The build scripts import only the standard library, so there is
      # nothing to install and no lockfile to go stale.
      - name: Confirm nothing needs installing
        run: python -c "import sys; print(sys.version)"

      - name: Run the six checks
        run: python scripts/check_site.py

      # check_site.py proves the built tree renders identically to docs/.
      # This proves it is byte identical, which is a different claim: a hand
      # edit to whitespace, an entity, or a line ending renders the same and
      # fails here. It is also the check that would have caught the line
      # endings, because this runner is where that defect was visible.
      - name: Confirm docs/ is exactly what the build produces
        run: |
          python scripts/build_site.py --out docs
          git diff --exit-code -- docs/

      # Clones the tree outside the repo, rebrands it to a fixture business and
      # re-runs the checks, so the claim that a new owner could take this over
      # is tested rather than asserted. It is off the default path locally
      # because it takes about a minute; here that does not matter.
      - name: Rehearse a rebrand
        run: python scripts/rehearse_rebrand.py --out "${{ runner.temp }}/rehearsal"

  # Publishes docs/ to Pages, and only if every step above passed. This is the
  # go-live. A pull request runs the checks and deploys nothing.
  deploy:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/configure-pages@v6

      # docs/ is the published tree, byte for byte what the job above just
      # confirmed the build produces. CNAME travels with it, which is how the
      # custom domain survives a deploy.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v5
